# =============================================================================
# Lab 2 stack: MLflow tracking server + Airflow (Postgres-backed)
# DDM501
#
# Compose V2 needs no `version:` key.
#
#   docker compose up -d mlflow          # tracking only, enough for most of the lab
#   docker compose up -d                 # the whole stack including Airflow
#
#   MLflow   http://localhost:5000
#   Airflow  http://localhost:8080  (airflow / airflow)
#
# On Linux, run `echo "AIRFLOW_UID=$(id -u)" > .env` once before the first
# `up`, so the Airflow containers can write to the bind-mounted logs/ and
# artifacts/ directories (macOS and Windows do not need it).
# =============================================================================
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  # Official Airflow pattern: run as the host user (group 0) so files written to
  # the bind mounts are owned by you, not by an unknown uid 50000.
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # The DAG resolves `pipeline` from here.
    PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    # Inside the compose network the tracking server is reachable by service name.
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PIPELINE_RUN_DIR: /opt/airflow/artifacts
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./pipeline:/opt/airflow/project/pipeline
    - ./data:/opt/airflow/project/data
    - ./artifacts:/opt/airflow/artifacts
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # MLflow tracking server + model registry
  # ---------------------------------------------------------------------------
  # Backend store (runs, params, metrics, registry) in SQLite and artifacts
  # (models, JSON reports) under /mlflow/artifacts — both on the named volume
  # mlflow_data, so `docker compose down` (without -v) keeps the history.
  #
  # Note the FOUR slashes in sqlite:////mlflow/mlflow.db. Three is a relative
  # path, four is absolute. With three, the database lands wherever the process
  # happens to start and disappears on the next restart, taking your entire
  # experiment history with it.
  #
  # --host 0.0.0.0 for the same reason as Lab 1: bound to localhost inside the
  # container, nothing outside can reach it.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: ddm501-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    # Artifacts are PROXIED: clients upload over HTTP and the server writes them
    # to /mlflow/artifacts on the volume. A plain `--default-artifact-root
    # /mlflow/artifacts` would hand that path to every client, which then tries
    # to write to its OWN /mlflow (on the host: "Read-only file system: '/mlflow'";
    # in the Airflow containers: permission denied).
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --default-artifact-root mlflow-artifacts:/
      --host 0.0.0.0 --port 5000
    healthcheck:
      # The image has no curl or wget; its Python is enough to hit /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Airflow metadata database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ddm501-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot: migrate the metadata DB and create the admin user
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: ddm501-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username airflow --password airflow \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: ddm501-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: ddm501-airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mlflow_data:
  postgres_data:
